</div>

<script src="assets/js/products.js"></script>
<script src="assets/js/main.js"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  let active = params.get("category") || "all";
  const filters = document.getElementById("filters");
  const grid = document.getElementById("shop-grid");
  const cats = [{ id: "all", label: "All" }].concat(CATEGORIES);
  function render() {
    filters.innerHTML = cats.map(c =>
      `<button type="button" class="btn chip" data-cat="${c.id}" aria-pressed="${c.id === active}">${c.label}</button>`).join("");
    const list = active === "all" ? PRODUCTS : PRODUCTS.filter(p => p.category === active);
    grid.innerHTML = list.length ? list.map(productCard).join("") : `<p class="empty">Nothing here yet. New prints are on the way.</p>`;
  }
  filters.addEventListener("click", e => {
    const b = e.target.closest("[data-cat]");
    if (!b) return;
    active = b.dataset.cat;
    const url = new URL(location.href);
    if (active === "all") url.searchParams.delete("category"); else url.searchParams.set("category", active);
    history.replaceState(null, "", url);
    render();
  });
  render();
})();
</script>
</body>
